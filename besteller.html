<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bestellen — Website Bestellen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="merk">Teken<span>bureau</span> Bestellingen</div>
  <a href="index.html" class="terug-link">&larr; Terug</a>

  <!-- Tabs bovenaan: nieuwe bestelling / mijn bestellingen -->
  <div class="bon-wrapper" style="padding-top: 100px; align-items: flex-start;">
    <div style="width: 100%; max-width: 560px;">
      <nav class="tabs">
        <button type="button" class="tab-knop actief" id="tab-nieuw">Nieuwe bestelling</button>
        <button type="button" class="tab-knop" id="tab-mijn">Mijn bestellingen</button>
      </nav>

      <!-- ================= Weergave: bestelformulier ================= -->
      <section id="weergave-formulier">
        <form class="bon" id="bestel-formulier" novalidate>
          <div class="ontvangen-stempel" id="ontvangen-stempel">Ontvangen</div>

          <div class="bon-kop">
            <div>
              <h1>Bestelbon</h1>
              <p>Vertel ons wat voor website je nodig hebt.</p>
            </div>
            <div class="bon-nummer" id="bon-nummer">nr. —</div>
          </div>

          <div class="veld">
            <label for="titel">Titel van je ontwerp</label>
            <input type="text" id="titel" name="titel" placeholder="Bijv. 'Website voor mijn bakkerij'" required maxlength="120" />
          </div>

          <div class="veld">
            <label for="omschrijving">Wat wil je precies?</label>
            <textarea id="omschrijving" name="omschrijving" placeholder="Beschrijf zo concreet mogelijk wat de website moet doen, hoe hij eruit moet zien en wat er op moet staan." required maxlength="4000"></textarea>
          </div>

          <div class="bon-actie">
            <button type="submit" class="knop-verzend" id="verzend-knop">Bestelling verzenden</button>
            <span class="status-tekst" id="status-tekst"></span>
          </div>
        </form>
      </section>

      <!-- ================= Weergave: mijn bestellingen ================= -->
      <section id="weergave-mijn" hidden>
        <div class="mini-lijst" id="mijn-lijst">
          <p class="leeg-melding">Bestellingen laden...</p>
        </div>
      </section>

      <!-- ================= Weergave: bestelling detail ================= -->
      <section id="weergave-detail" hidden>
        <button type="button" class="terug-inline" id="detail-terug">&larr; Terug naar mijn bestellingen</button>
        <div class="detail-kaart" id="detail-kaart"></div>
      </section>

      <!-- ================= Weergave: chat ================= -->
      <section id="weergave-chat" hidden>
        <button type="button" class="terug-inline" id="chat-terug">&larr; Terug naar bestelling</button>
        <div class="chat-kader">
          <p class="chat-titel" id="chat-titel">Chat over: —</p>
          <div class="chat-berichten" id="chat-berichten"></div>
          <form class="chat-invoer" id="chat-formulier">
            <input type="text" id="chat-invoerveld" placeholder="Typ een bericht..." maxlength="1000" autocomplete="off" required />
            <button type="submit">Stuur</button>
          </form>
        </div>
      </section>
    </div>
  </div>

  <!-- Firebase SDK (compat-versie, geen build-stap nodig) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>
  <script src="besteller.js"></script>
</body>
</html>
