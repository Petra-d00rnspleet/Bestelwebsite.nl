<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bestelling plaatsen — Website Bestellen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="merk">Teken<span>bureau</span> Bestellingen</div>
  <a href="index.html" class="terug-link">&larr; Terug</a>

  <main class="bon-wrapper">
    <form class="bon" id="bestel-formulier" novalidate>
      <div class="ontvangen-stempel" id="ontvangen-stempel">Ontvangen</div>

      <div class="bon-kop">
        <div>
          <h1>Bestelbon</h1>
          <p>Vertel ons wat voor website je nodig hebt.</p>
        </div>
        <div class="bon-nummer" id="bon-nummer">nr. —</div>
      </div>

      <div class="veld">
        <label for="titel">Titel van je ontwerp</label>
        <input type="text" id="titel" name="titel" placeholder="Bijv. 'Website voor mijn bakkerij'" required maxlength="120" />
      </div>

      <div class="veld">
        <label for="omschrijving">Wat wil je precies?</label>
        <textarea id="omschrijving" name="omschrijving" placeholder="Beschrijf zo concreet mogelijk wat de website moet doen, hoe hij eruit moet zien en wat er op moet staan." required maxlength="4000"></textarea>
      </div>

      <div class="bon-actie">
        <button type="submit" class="knop-verzend" id="verzend-knop">Bestelling verzenden</button>
        <span class="status-tekst" id="status-tekst"></span>
      </div>
    </form>
  </main>

  <!-- Firebase SDK (compat-versie, geen build-stap nodig) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>
  <script src="besteller.js"></script>
</body>
</html>
