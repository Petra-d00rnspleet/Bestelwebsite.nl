<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beheerder — Website Bestellen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="merk">Teken<span>bureau</span> Bestellingen</div>
  <a href="index.html" class="terug-link">&larr; Terug</a>

  <!-- ================= Wachtwoordscherm ================= -->
  <!-- Dit hele blok verdwijnt permanent (via JS verwijderd) zodra er is ingelogd. -->
  <main class="login-wrapper" id="login-scherm">
    <form class="login-bon" id="login-formulier">
      <h1>Beheerder</h1>
      <p>Vul het wachtwoord in om de bestellingen te bekijken.</p>
      <div class="veld">
        <label for="wachtwoord">Wachtwoord</label>
        <input type="password" id="wachtwoord" name="wachtwoord" required />
      </div>
      <button type="submit" class="knop-verzend" style="width: 100%;">Inloggen</button>
      <p class="status-tekst fout" id="login-fout" style="margin-top: 12px;"></p>
    </form>
  </main>

  <!-- ================= Weergave: bestellingen lijst ================= -->
  <div class="pagina pagina-breed" id="weergave-lijst" hidden>
    <div class="dashboard-kop" style="margin-top: -14px;">
      <div>
        <h1 style="margin-bottom: 4px;">Bestellingen</h1>
        <div class="telling" id="telling">0 bestellingen</div>
      </div>
      <button class="uitloggen" id="uitlog-knop">Uitloggen</button>
    </div>
    <div class="mini-lijst" id="bestellingen-lijst">
      <p class="leeg-melding">Bestellingen laden...</p>
    </div>
  </div>

  <!-- ================= Weergave: bestelling detail ================= -->
  <div class="pagina" id="weergave-detail" hidden>
    <button type="button" class="terug-inline" id="detail-terug">&larr; Terug naar bestellingen</button>
    <div class="status-knoppen" id="status-knoppen">
      <button type="button" class="status-knop" data-status="nieuw">Nieuw</button>
      <button type="button" class="status-knop" data-status="in-behandeling">In behandeling</button>
      <button type="button" class="status-knop" data-status="afgerond">Afgerond</button>
    </div>
    <div class="detail-kaart" id="detail-kaart"></div>
  </div>

  <!-- ================= Weergave: chat ================= -->
  <div class="pagina" id="weergave-chat" hidden>
    <button type="button" class="terug-inline" id="chat-terug">&larr; Terug naar bestelling</button>
    <div class="chat-kader">
      <p class="chat-titel" id="chat-titel">Chat over: —</p>
      <div class="chat-berichten" id="chat-berichten"></div>
      <form class="chat-invoer" id="chat-formulier">
        <input type="text" id="chat-invoerveld" placeholder="Typ een bericht..." maxlength="1000" autocomplete="off" required />
        <button type="submit">Stuur</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK (compat-versie, geen build-stap nodig) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>
  <script src="beheerder.js"></script>
</body>
</html>
